name: llama.cpp API drift check

on:
  push:
    paths:
      - 'llama.cpp'
      - 'generate/**'
      - 'src/bindings.lisp'
      - '.github/workflows/api-drift-check.yml'
  pull_request:
    paths:
      - 'llama.cpp'
      - 'generate/**'
      - 'src/bindings.lisp'
      - '.github/workflows/api-drift-check.yml'
  workflow_dispatch: {}

env:
  C2FFI_TAG: v17.0.6.0
  LLVM_VERSION: 17.0.6

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout cl-llama-cpp
        uses: actions/checkout@v4

      - name: Checkout llama.cpp submodule (headers only, shallow)
        run: git submodule update --init --depth 1 llama.cpp

      - name: Cache c2ffi binary
        id: c2ffi-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/c2ffi
          key: c2ffi-${{ env.C2FFI_TAG }}-llvm${{ env.LLVM_VERSION }}-${{ runner.os }}

      - name: Build c2ffi from source
        if: steps.c2ffi-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin "$RUNNER_TEMP/llvm"
          curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/clang+llvm-${LLVM_VERSION}-x86_64-linux-gnu-ubuntu-22.04.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP/llvm" --strip-components=1
          # The official release tarball ships LLVM/Clang as static libs only
          # (correct CMake config layout, but no combined libLLVM.so). c2ffi's
          # link step needs -lLLVM, so pull just that shared library from
          # Ubuntu's llvm-17-dev package (same 17.0.6 build) and point the
          # linker at it.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends llvm-17-dev
          git clone --depth 1 --branch "$C2FFI_TAG" https://github.com/rpav/c2ffi.git "$RUNNER_TEMP/c2ffi"
          cmake -B "$RUNNER_TEMP/c2ffi/build" -S "$RUNNER_TEMP/c2ffi" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$RUNNER_TEMP/llvm/lib/cmake/llvm" \
            -DClang_DIR="$RUNNER_TEMP/llvm/lib/cmake/clang" \
            -DCMAKE_EXE_LINKER_FLAGS="-L/usr/lib/llvm-17/lib"
          cmake --build "$RUNNER_TEMP/c2ffi/build" -j"$(nproc)"
          cp "$RUNNER_TEMP/c2ffi/build/bin/c2ffi" ~/.local/bin/c2ffi

      - name: Add c2ffi to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Roswell
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/release/scripts/install-for-ci.sh | sh
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Run check-bindings
        run: |
          set +e
          OUTPUT=$(ros -e '(ql:quickload "cl-llama-cpp/generate" :silent t)' \
                       -e '(if (cl-llama-cpp/generate:check-bindings :rebuild-spec t) (uiop:quit 1) (uiop:quit 0))' 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::llama.cpp API drift detected against the pinned submodule commit -- review the check-bindings output above and update src/bindings.lisp deliberately."
          fi
          exit 0
